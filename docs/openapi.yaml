openapi: 3.0.3
info:
  title: Anveshan API
  version: 0.1.0
  description: >-
    Program and scope monitoring API for HackerOne data: public
    program/asset/change reads, session-authenticated subscriptions and
    watches, and a key-authenticated admin collection trigger.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/programs:
    get:
      summary: List programs
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          description: Case-insensitive substring filter on name and handle (externalId). Empty/missing returns all programs.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Program list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Program"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/programs/{id}:
    get:
      summary: Get program by internal UUID
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Program"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
  /api/v1/programs/{id}/assets:
    get:
      summary: List program assets
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - name: scope
          in: query
          schema:
            type: string
            enum: [ALL, IN, OUT]
            default: ALL
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSizeLarge"
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
  /api/v1/programs/{id}/changes:
    get:
      summary: List program changes
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSizeLarge"
      responses:
        "200":
          description: Change list (detected_at DESC)
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Change"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
  /api/v1/auth/request-magic-link:
    post:
      summary: Send a one-time sign-in link (rate-limited per IP + email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        "200":
          description: Always 200 (no email oracle), even when mail is not sent
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/EmailRateLimited"
  /api/v1/auth/verify:
    post:
      summary: Verify a magic-link token, create a session, set cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: "Authenticated user (Set-Cookie: session)"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
  /api/v1/auth/me:
    get:
      summary: Current session user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      summary: Delete the current session, clear cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/subscriptions:
    get:
      summary: Get my subscription config (null when none)
      responses:
        "200":
          description: Subscription or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Save subscription (also clears any unsubscribe opt-out)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency, watchNewPrograms, watchAllPrograms]
              properties:
                frequency:
                  type: string
                  enum: [immediate, daily]
                watchNewPrograms:
                  type: boolean
                watchAllPrograms:
                  type: boolean
                digestTimezone:
                  type: string
                  example: Asia/Kolkata
                  description: >
                    IANA timezone for the daily close. Optional; omitted
                    fields leave stored values unchanged.
                digestTimeLocal:
                  type: string
                  example: "13:30"
                  description: >
                    Wall-clock daily close (24h HH:MM) in digestTimezone.
                    Optional; omitted fields leave stored values unchanged.
      responses:
        "200":
          description: Saved subscription
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/subscriptions/watches:
    get:
      summary: List my watched programs
      responses:
        "200":
          description: Watched programs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WatchedProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Watch a program (404 when the program id is unknown)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programId]
              properties:
                programId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Watched
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
  /api/v1/subscriptions/watches/{programId}:
    delete:
      summary: Remove a program from my watch list (idempotent)
      parameters:
        - $ref: "#/components/parameters/WatchProgramId"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/collections:
    post:
      summary: Trigger a collection run (async, admin key required)
      description: >
        Returns 202 immediately; the 15-20 minute run proceeds in the
        background. Returns 200 with status skipped when a trigger is
        already in flight. Poll GET /api/v1/admin/collections for status.
        Header X-Admin-Key must match ADMIN_API_KEY (fail-closed when unset).
      parameters:
        - name: X-Admin-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Collection started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, startedAt]
                    properties:
                      status:
                        type: string
                        example: running
                      startedAt:
                        type: string
                        format: date-time
        "200":
          description: Trigger skipped (already in flight)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, startedAt]
                    properties:
                      status:
                        type: string
                        example: skipped
                      startedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: List recent collection runs (admin key required)
      parameters:
        - name: X-Admin-Key
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/collections/{id}:
    get:
      summary: Get a collection run by id (admin key required)
      parameters:
        - name: X-Admin-Key
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Collection run
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
  /api/v1/unsubscribe:
    post:
      summary: Global unsubscribe via signed link token (no login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, token]
              properties:
                userId:
                  type: string
                  format: uuid
                token:
                  type: string
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
components:
  parameters:
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WatchProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageSizeLarge:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
  schemas:
    Program:
      type: object
      required: [id, platform, externalId, name]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          example: hackerone
        externalId:
          type: string
          example: acme
        name:
          type: string
          example: Acme
        url:
          type: string
          example: https://hackerone.com/acme
        updatedAt:
          type: string
          format: date-time
    Asset:
      type: object
      required: [id, identifier, type, scope]
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
          example: api.example.com
        type:
          type: string
          enum: [DOMAIN, WILDCARD, IP, CIDR, URL, ANDROID, IOS, API, OTHER]
        scope:
          type: string
          enum: [IN, OUT]
    Change:
      type: object
      required: [id, type, programId, detectedAt, collectionRunId]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [PROGRAM_ADDED, ASSET_ADDED, ASSET_REMOVED]
        programId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          nullable: true
        assetIdentifier:
          type: string
          nullable: true
        collectionRunId:
          type: string
          format: uuid
        detectedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    Subscription:
      type: object
      nullable: true
      required:
        [
          frequency,
          watchNewPrograms,
          watchAllPrograms,
          digestTimezone,
          digestTimeLocal,
          updatedAt,
        ]
      properties:
        frequency:
          type: string
          enum: [immediate, daily]
        watchNewPrograms:
          type: boolean
        watchAllPrograms:
          type: boolean
        digestTimezone:
          type: string
          example: Asia/Kolkata
          description: IANA timezone for the daily close.
        digestTimeLocal:
          type: string
          example: "13:30"
          description: Wall-clock daily close (24h HH:MM) in digestTimezone.
        nextDigestAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Next daily close (null for immediate cadence or unusable prefs).
        updatedAt:
          type: string
          format: date-time
    WatchedProgram:
      type: object
      required: [programId, name, externalId]
      properties:
        programId:
          type: string
          format: uuid
        name:
          type: string
        externalId:
          type: string
    AdminRun:
      type: object
      required:
        [
          id,
          status,
          startedAt,
          programsSeen,
          assetsSeen,
          programsAdded,
          assetsAdded,
          assetsRemoved,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, completed, failed]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        programsSeen:
          type: integer
        assetsSeen:
          type: integer
        programsAdded:
          type: integer
        assetsAdded:
          type: integer
        assetsRemoved:
          type: integer
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  PROGRAM_NOT_FOUND,
                  RUN_NOT_FOUND,
                  BAD_REQUEST,
                  INTERNAL,
                  COLLECTION_FAILED,
                  AUTH_FAILED,
                  RATE_LIMITED,
                  NETWORK,
                  TIMEOUT,
                  UNAUTHORIZED,
                  INVALID_TOKEN,
                  EMAIL_RATE_LIMITED,
                ]
            message:
              type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProgramNotFound:
      description: Program not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RunNotFound:
      description: Collection run not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidToken:
      description: Bad magic-link or unsubscribe token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EmailRateLimited:
      description: Too many magic-link requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
