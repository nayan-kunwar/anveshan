openapi: 3.0.3
info:
  title: Anveshan API
  version: 0.1.0
  description: Read-only MVP API for HackerOne program/scope monitoring.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/programs:
    get:
      summary: List programs
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Program list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Program"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/programs/{id}:
    get:
      summary: Get program by internal UUID
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Program"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
  /api/v1/programs/{id}/assets:
    get:
      summary: List program assets
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - name: scope
          in: query
          schema:
            type: string
            enum: [ALL, IN, OUT]
            default: ALL
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSizeLarge"
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
  /api/v1/programs/{id}/changes:
    get:
      summary: List program changes
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSizeLarge"
      responses:
        "200":
          description: Change list (detected_at DESC)
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Change"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          $ref: "#/components/responses/ProgramNotFound"
components:
  parameters:
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageSizeLarge:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
  schemas:
    Program:
      type: object
      required: [id, platform, externalId, name]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          example: hackerone
        externalId:
          type: string
          example: acme
        name:
          type: string
          example: Acme
        url:
          type: string
          example: https://hackerone.com/acme
        updatedAt:
          type: string
          format: date-time
    Asset:
      type: object
      required: [id, identifier, type, scope]
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
          example: api.example.com
        type:
          type: string
          enum: [DOMAIN, WILDCARD, IP, CIDR, URL, ANDROID, IOS, API, OTHER]
        scope:
          type: string
          enum: [IN, OUT]
    Change:
      type: object
      required: [id, type, programId, detectedAt, collectionRunId]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [PROGRAM_ADDED, ASSET_ADDED, ASSET_REMOVED]
        programId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          nullable: true
        assetIdentifier:
          type: string
          nullable: true
        collectionRunId:
          type: string
          format: uuid
        detectedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  PROGRAM_NOT_FOUND,
                  BAD_REQUEST,
                  INTERNAL,
                  COLLECTION_FAILED,
                  AUTH_FAILED,
                  RATE_LIMITED,
                  NETWORK,
                  TIMEOUT,
                ]
            message:
              type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProgramNotFound:
      description: Program not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
