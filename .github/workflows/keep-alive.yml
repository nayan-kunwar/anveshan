name: keep-render-awake

# Render's free web service sleeps after ~15 minutes without traffic, which
# also stops node-cron, the 30s delivery worker, and the digest tick. Ping
# /health every 5 minutes so the process stays up.
#
# Public repo: scheduled runs do not consume paid Actions minutes.
# GitHub runs scheduled workflows from the default branch only, and may
# delay a run under load — see docs/deploy.md "Free-tier keep-alive".
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            https://anveshan-wfgg.onrender.com/health
